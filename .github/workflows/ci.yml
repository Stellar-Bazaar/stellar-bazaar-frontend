name: Stellar Bazaar Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-ci:
    name: Typecheck, Vitest, Bundle Analysis & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm Store Directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Strict TypeScript Verification
        run: pnpm run typecheck

      - name: Run Vitest Suite
        run: pnpm test

      - name: Build Production Distribution
        run: pnpm run build

      - name: Validate Production Bundle Sizes & Budget
        run: |
          echo "Analyzing bundle sizes..."
          ls -lh dist/assets/
          MAX_CHUNK_BYTES=600000 # 600 KB chunk threshold
          for chunk in dist/assets/*.js; do
            if [ -f "$chunk" ]; then
              SIZE=$(wc -c < "$chunk")
              NAME=$(basename "$chunk")
              echo "Chunk $NAME: $SIZE bytes"
              if [ "$SIZE" -gt "$MAX_CHUNK_BYTES" ]; then
                echo "Warning: Bundle chunk $NAME ($SIZE bytes) exceeds recommended threshold of $MAX_CHUNK_BYTES bytes"
              fi
            fi
          done
          test -f dist/index.html && echo "Production index.html generated successfully."
